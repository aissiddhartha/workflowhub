name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

env:
  VITE_API_URL: http://localhost:8000

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t workflowhub-backend ./backend
      - name: Check Django configuration inside the container
        run: docker run --rm -e DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }} workflowhub-backend python manage.py check
      - name: Run unit tests inside the container
        run: docker run --rm -e DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }} workflowhub-backend python manage.py test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build --build-arg VITE_API_URL=$VITE_API_URL -t workflowhub-frontend ./frontend