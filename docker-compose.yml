services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflowhub}
      POSTGRES_USER: ${POSTGRES_USER:-workflowhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-workflowhub} -d ${POSTGRES_DB:-workflowhub}
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflowhub}
      POSTGRES_USER: ${POSTGRES_USER:-workflowhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), 5).close()"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL}
    environment:
      BACKEND_PROXY_URL: ${BACKEND_PROXY_URL:?Set BACKEND_PROXY_URL}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/ || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  playwright:
    image: workflowhub-playwright:latest
    build:
      context: ./e2e
    environment:
      BASE_URL: ${PLAYWRIGHT_BASE_URL}
      CI: "true"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./e2e/playwright-report:/app/playwright-report
      - ./e2e/test-results:/app/test-results
    profiles:
      - test
    ipc: host

volumes:
  postgres_data: